# GoAccess configuration for Traefik access logs

# Time format (Traefik default: ISO 8601)
time-format %H:%M:%S

# Date format
date-format %d/%b/%Y

# Combined Log Format (CLF with virtual host)
log-format %h - %^ [%d:%t %^] "%r" %s %b "%R" "%u"

# Real-time HTML output
real-time-html true
ws-url wss://access.creco.dev

# Output
output /var/www/goaccess/index.html

# Database
db-path /tmp/goaccess-db/

# UI
html-report-title GoAccess - access.creco.dev

# Panels
enable-panel VISITORS
enable-panel REQUESTS
enable-panel REQUESTS_STATIC
enable-panel NOT_FOUND
enable-panel HOSTS
enable-panel OS
enable-panel BROWSERS
enable-panel VISIT_TIMES
enable-panel VIRTUAL_HOSTS
enable-panel REFERRING_SITES
enable-panel STATUS_CODES
enable-panel GEO_LOCATION
