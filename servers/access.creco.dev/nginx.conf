server {
    listen 80;
    server_name _;

    root /var/www/goaccess;
    index dashboard.html;

    # Login page
    location = /login {
        default_type text/html;
        alias /var/www/auth/login.html;
    }

    # Auth endpoints
    location = /auth {
        proxy_pass http://127.0.0.1:3000/auth;
        proxy_set_header Content-Type $content_type;
    }

    location = /logout {
        proxy_pass http://127.0.0.1:3000/logout;
        proxy_set_header Cookie $http_cookie;
    }

    # API endpoints (auth checked internally by Node)
    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_set_header Cookie $http_cookie;
    }

    # GoAccess report
    location = /goaccess {
        default_type text/html;
        alias /var/www/goaccess/report.html;
    }

    # WebSocket for GoAccess
    location /ws {
        proxy_pass http://127.0.0.1:7890;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Dashboard (auth handled by frontend via API check)
    location / {
        try_files $uri /dashboard.html;
    }
}
