server {
    listen 80;
    server_name _;

    root /var/www/goaccess;
    index dashboard.html;

    # Login page - no auth required
    location = /login {
        default_type text/html;
        alias /var/www/auth/login.html;
    }

    location = /auth {
        proxy_pass http://127.0.0.1:3000/auth;
        proxy_set_header Content-Type $content_type;
    }

    location = /logout {
        proxy_pass http://127.0.0.1:3000/logout;
    }

    # API endpoints - proxied to auth-server (auth checked internally)
    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_set_header Cookie $http_cookie;
    }

    # GoAccess report at /goaccess
    location /goaccess {
        auth_request /auth_check;
        error_page 401 = @login_redirect;
        alias /var/www/goaccess/report.html;
    }

    # WebSocket for GoAccess real-time
    location /ws {
        proxy_pass http://127.0.0.1:7890;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # Dashboard at root - check auth cookie
    location / {
        auth_request /auth_check;
        error_page 401 = @login_redirect;
        try_files $uri $uri/ /dashboard.html;
    }

    location = /auth_check {
        internal;
        proxy_pass http://127.0.0.1:3000/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    location @login_redirect {
        return 302 /login;
    }
}
