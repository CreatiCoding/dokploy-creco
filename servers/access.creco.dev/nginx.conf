server {
    listen 80;
    server_name _;

    root /var/www/goaccess;
    index index.html;

    # Login page - no auth required
    location = /login {
        alias /var/www/auth/login.html;
    }

    location = /auth {
        proxy_pass http://127.0.0.1:3000/auth;
        proxy_set_header Content-Type $content_type;
    }

    location = /logout {
        proxy_pass http://127.0.0.1:3000/logout;
    }

    # WebSocket - no auth (browser handles after login)
    location /ws {
        proxy_pass http://127.0.0.1:7890;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # All other routes - check auth cookie
    location / {
        auth_request /auth_check;
        error_page 401 = @login_redirect;
        try_files $uri $uri/ /index.html;
    }

    location = /auth_check {
        internal;
        proxy_pass http://127.0.0.1:3000/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    location @login_redirect {
        return 302 /login;
    }
}
